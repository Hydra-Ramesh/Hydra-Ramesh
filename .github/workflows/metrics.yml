name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:
  push:

jobs:
  generate-stats:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output_action: none
          filename: github-metrics.svg
          user: Hydra-Ramesh
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_sections: base
          config_display: large
          config_output: svg

      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output_action: none
          filename: top-languages.svg
          user: Hydra-Ramesh
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          config_display: large
          config_output: svg

      - name: Generate Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output_action: none
          filename: achievements.svg
          user: Hydra-Ramesh
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          config_display: large
          config_output: svg

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Hydra-Ramesh"
          git config user.email "dasramesh8343003905@gmail.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          for file in github-metrics.svg top-languages.svg achievements.svg; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          
          if git diff --cached --quiet; then
            echo "No metric changes detected; skipping commit."
          else
            git commit -m "chore: update GitHub metrics [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
